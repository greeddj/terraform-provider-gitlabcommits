version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # No `include: scope`: it appends a second (deps) scope, and the
    # `fix(deps)(deps)` title that produces does not match the changelog
    # group in .goreleaser.yml, so the bump lands under Bug Fixes.
    commit-message:
      prefix: "fix(deps)"
    groups:
      hashicorp:
        patterns:
          - "github.com/hashicorp/*"
      gitlab-client:
        patterns:
          - "gitlab.com/gitlab-org/api/client-go"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix(ci)"
