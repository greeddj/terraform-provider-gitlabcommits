version: 2
updates:
  # Version updates cover only the direct requirements in go.mod. The tool
  # block and every indirect module (x/net, x/crypto, grpc and protobuf in the
  # shipped binary among them) are marked indirect, which dependabot skips, so
  # they move only through the manual refresh described in CLAUDE.md.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # No `include: scope`: it appends a second (deps) scope, and the
    # `fix(deps)(deps)` title that produces does not match the changelog
    # group in .goreleaser.yml, so the bump lands under Bug Fixes.
    commit-message:
      prefix: "fix(deps)"
    groups:
      hashicorp:
        patterns:
          - "github.com/hashicorp/*"
      gitlab-client:
        patterns:
          # Wildcarded: dependabot matches the module path, which carries the
          # major suffix, so a literal would stop grouping at the next major.
          - "gitlab.com/gitlab-org/api/client-go*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # fix(ci) titles land in the changelog's CI group, not under Bug Fixes.
    commit-message:
      prefix: "fix(ci)"
