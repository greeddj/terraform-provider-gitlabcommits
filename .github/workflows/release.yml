name: Release

on:
  push:
    tags:
      - 'v*'

# The write scope is confined to the release job: the test job runs
# third-party tool binaries (golangci-lint, terraform) and must not hold a
# token that can push commits, tags, or release assets.
permissions:
  contents: read

jobs:
  tests_and_checks:
    name: Tests and Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false

      - name: Run check
        run: |
          go vet ./...
          go tool staticcheck ./...
          go tool govulncheck ./...
          go tool fieldalignment ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.13.1
          install-mode: binary

      - name: Run tests
        run: go test -v -race ./...

      - name: Check terraform fmt (examples)
        run: terraform fmt -check -recursive examples/

      - name: Verify generated docs are in sync
        # git status --porcelain also catches brand-new untracked doc pages,
        # which git diff would silently ignore.
        run: |
          go generate ./...
          test -z "$(git status --porcelain -- docs)" || { git status --porcelain -- docs; git diff -- docs; exit 1; }

      - name: Verify copywrite headers are in sync
        run: go tool copywrite headers -d . --config .copywrite.hcl --plan

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [tests_and_checks]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
