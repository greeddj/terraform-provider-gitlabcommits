name: Release

on:
  push:
    tags:
      - 'v*'

# The write scope is confined to the release job: the gate reused from ci.yml
# runs third-party tool binaries (golangci-lint, terraform) and must not hold a
# token that can push commits, tags, or release assets. The Go cache is the
# same boundary, so the release job never restores one (see its setup-go).
permissions:
  contents: read

# A release must never be cancelled halfway, so an in-progress run is left to
# finish; the prefix differs from ci.yml's group, which this workflow calls.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The full CI gate, defined once in ci.yml and called here so a tag is held
  # to exactly the checks main is held to.
  tests_and_checks:
    name: Tests and Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    # Passed explicitly rather than inherited: the called workflow has no
    # business seeing the GPG key or any other release secret.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [tests_and_checks]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # goreleaser authenticates with the GITHUB_TOKEN env below; the
          # checkout must not leave the token in .git/config as well.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # A restored cache was saved by jobs that run third-party binaries,
          # and go trusts an extracted module tree and cached build outputs
          # without re-hashing them. The signed build starts from a clean
          # download, which go checks against go.sum.
          cache: false

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # An exact version rather than '~> v2', which resolves at release
          # time: two tags cut a week apart would otherwise be built by two
          # different goreleasers with no commit recording the change.
          # Dependabot moves the action SHA above but never a `with:` input,
          # so this line is bumped by hand. ci.yml rehearses the release with
          # the same action SHA and version; the two must move together.
          version: 'v2.18.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
