name: Acceptance Tests

# Acceptance tests run against a real GitLab instance. They require secrets
# (token + project) and so should NOT run on PRs from forks. We trigger them
# manually via workflow_dispatch and on a schedule against `main`, so the
# default-branch state is always known to be green.
on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC every day — late enough to not collide with release jobs,
    # offset by an odd number to spread load across CI providers.
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/acceptance.yml'

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # If GITLAB_TOKEN secret is not set, scheduled/push runs become a no-op so
    # forks / community contributors don't see red CI for missing secrets; a
    # manual workflow_dispatch instead fails loudly (see the run step) so it
    # cannot silently skip.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'greeddj/terraform-provider-gitlabcommits' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false

      - name: Run acceptance tests
        env:
          TF_ACC: '1'
          GITLAB_TOKEN: ${{ secrets.GITLAB_TEST_TOKEN }}
          GITLAB_BASE_URL: ${{ secrets.GITLAB_TEST_BASE_URL }}
          GITLAB_TEST_PROJECT_ID: ${{ secrets.GITLAB_TEST_PROJECT_ID }}
          # Unique per-run branch: the test config materialises it via
          # create_branch_from and deletes it in cleanup, so runs never
          # collide and never leave branches behind.
          GITLAB_TEST_BRANCH: 'tf-acc-test-${{ github.run_id }}'
          GITLAB_TEST_BRANCH_FROM: 'main'
        run: |
          if [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_TEST_PROJECT_ID" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::GITLAB_TEST_TOKEN / GITLAB_TEST_PROJECT_ID secrets not configured - a manual run cannot silently skip"
              exit 1
            fi
            echo "::warning::GITLAB_TEST_TOKEN / GITLAB_TEST_PROJECT_ID secrets not configured - skipping acceptance tests"
            exit 0
          fi
          go test -v -timeout=20m -run '^TestAcc' ./internal/...
