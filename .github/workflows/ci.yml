name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests_and_checks:
    name: Tests and Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 'latest'
          terraform_wrapper: false

      - name: Run check
        run: |
          go vet ./...
          go tool staticcheck ./...
          go tool govulncheck ./...
          go tool fieldalignment ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest
          install-mode: binary

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check terraform fmt (examples)
        run: terraform fmt -check -recursive examples/

      - name: Verify generated docs are in sync
        run: |
          go generate ./...
          git diff --exit-code -- docs

      - name: Verify copywrite headers are in sync
        run: |
          go tool copywrite headers -d . --config .copywrite.hcl
          git diff --exit-code

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Upload coverage
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
