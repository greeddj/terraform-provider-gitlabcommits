name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  tests_and_checks:
    name: Tests and Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false

      - name: Run check
        run: |
          go vet ./...
          go tool staticcheck ./...
          go tool govulncheck ./...
          go tool fieldalignment ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          install-mode: binary

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check terraform fmt (examples)
        run: terraform fmt -check -recursive examples/

      - name: Validate example modules
        run: ./scripts/validate-examples.sh

      - name: Verify generated docs are in sync
        # git status --porcelain also catches brand-new untracked doc pages,
        # which git diff would silently ignore.
        run: |
          go generate ./...
          test -z "$(git status --porcelain -- docs)" || { git status --porcelain -- docs; git diff -- docs; exit 1; }

      - name: Verify copywrite headers are in sync
        run: go tool copywrite headers -d . --config .copywrite.hcl --plan

      - name: Check go mod tidy
        run: go mod tidy -diff

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
